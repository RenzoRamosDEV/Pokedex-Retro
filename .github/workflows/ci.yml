name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: calidad (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:html
      - run: npm test
      - run: npm run test:mutation
        if: matrix.node == 24
      - run: npm run test:mutation:ui
        if: matrix.node == 24
      - run: npx playwright install --with-deps chromium
        if: matrix.node == 24
      - run: npm run e2e
        if: matrix.node == 24
      - run: npm run lhci
        if: matrix.node == 24 && github.event_name == 'pull_request'
